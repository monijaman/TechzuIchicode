services:
  db:
    image: postgres:16-alpine
    container_name: fb-outlet-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fb_outlet}
      POSTGRES_USER: ${POSTGRES_USER:-fb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fb_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  structurizr:
    image: structurizr/structurizr:latest
    container_name: fb-outlet-structurizr
    restart: unless-stopped
    ports:
      - "${STRUCTURIZR_PORT:-8080}:8080"
    command: ["local"]
    volumes:
      - ./docs:/usr/local/structurizr

volumes:
  postgres_data:
