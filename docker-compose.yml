services:
  db:
    image: postgres:16-alpine
    container_name: fb-outlet-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fb_outlet}
      POSTGRES_USER: ${POSTGRES_USER:-fb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fb_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fb-outlet-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-fb_user}:${POSTGRES_PASSWORD:-fb_password}@db:5432/${POSTGRES_DB:-fb_outlet}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-5000}:5000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    container_name: fb-outlet-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-3000}:80"

  structurizr:
    image: structurizr/structurizr:latest
    container_name: fb-outlet-structurizr
    restart: unless-stopped
    ports:
      - "${STRUCTURIZR_PORT:-8080}:8080"
    command: ["local"]
    volumes:
      - ./docs:/usr/local/structurizr

volumes:
  postgres_data:
